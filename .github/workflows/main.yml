name: ci

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  matrix-tests:
    name: L${{ matrix.laravel }} | PHP ${{ matrix.php-version }} | SurrealDB ${{ matrix.surreal-version }}
    env:
      SURREALDB_HOST: localhost
      SURREALDB_PORT: 8000
      SURREALDB_USERNAME: root
      SURREALDB_PASSWORD: root
      SURREALDB_DATABASE: test
      SURREALDB_NAMESPACE: test
      SURREALDB_BOOTSTRAP: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.2"
            laravel: "10"
            testbench: "^8.0"
            surreal-version: "v2"
          - php-version: "8.2"
            laravel: "10"
            testbench: "^8.0"
            surreal-version: "v3"
          - php-version: "8.3"
            laravel: "11"
            testbench: "^9.0"
            surreal-version: "v2"
          - php-version: "8.3"
            laravel: "11"
            testbench: "^9.0"
            surreal-version: "v3"
          - php-version: "8.4"
            laravel: "12"
            testbench: "^10.0"
            surreal-version: "v2"
          - php-version: "8.4"
            laravel: "12"
            testbench: "^10.0"
            surreal-version: "v3"
          - php-version: "8.4"
            laravel: "13"
            testbench: "^11.0"
            surreal-version: "v2"
          - php-version: "8.4"
            laravel: "13"
            testbench: "^11.0"
            surreal-version: "v3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ matrix.laravel }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Pin Laravel/Testbench for this matrix leg
        run: >
          composer update
          "illuminate/container:^${{ matrix.laravel }}.0"
          "illuminate/database:^${{ matrix.laravel }}.0"
          "illuminate/events:^${{ matrix.laravel }}.0"
          "illuminate/support:^${{ matrix.laravel }}.0"
          "orchestra/testbench:${{ matrix.testbench }}"
          --with-all-dependencies
          --no-interaction
          --no-progress

      - name: Start SurrealDB
        run: sh ./tests/scripts/docker-restart.sh ${{ matrix.surreal-version }}

      - name: Execute tests
        run: vendor/bin/pest

      - name: Static analysis (Laravel 13 lane)
        if: matrix.laravel == '13' && matrix.surreal-version == 'v3'
        run: composer analyse

      - name: Format check (Laravel 13 lane)
        if: matrix.laravel == '13' && matrix.surreal-version == 'v3'
        run: composer format-check

      - name: Stop SurrealDB
        if: always()
        run: sh ./tests/scripts/docker-stop.sh
